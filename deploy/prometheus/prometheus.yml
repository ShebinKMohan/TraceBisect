global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/tracebisect-alerts.yml

scrape_configs:
  - job_name: tracebisect-studio
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/tracebisect_metrics_token
    static_configs:
      - targets:
          - api:8000
