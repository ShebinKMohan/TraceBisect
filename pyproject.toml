[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tracebisect"
version = "0.0.1a0"
description = "Git bisect for AI agent traces"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "TraceBisect contributors" },
]
keywords = ["ai", "llm", "agents", "observability", "pytest", "opentelemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.scripts]
tracebisect = "tracebisect.cli:main"

[project.urls]
Homepage = "https://github.com/tracebisect/tracebisect"
Repository = "https://github.com/tracebisect/tracebisect"
Issues = "https://github.com/tracebisect/tracebisect/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tracebisect"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tracebisect"]

