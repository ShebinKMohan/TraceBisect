[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tracebisect"
version = "0.1.0"
description = "Git bisect for AI agent traces"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "TraceBisect contributors" },
]
keywords = ["ai", "llm", "agents", "observability", "pytest", "opentelemetry"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "colorama>=0.4.6",
]

[project.optional-dependencies]
studio = [
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "fastapi>=0.115",
  "psycopg[binary,pool]>=3.2,<4",
  "python-multipart>=0.0.9",
  "svix>=1.98,<2",
  "uvicorn[standard]>=0.30",
]
dev = [
  "argon2-cffi>=23.1",
  "build>=1.2",
  "cryptography>=42",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mypy>=1.10",
  "psycopg[binary,pool]>=3.2,<4",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "python-multipart>=0.0.9",
  "ruff>=0.16.8,<0.17",
  "svix>=1.98,<2",
  "types-colorama>=0.4",
  "twine>=7.0",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
tracebisect = "tracebisect.cli:main"

[project.urls]
Homepage = "https://github.com/ShebinKMohan/TraceBisect"
Repository = "https://github.com/ShebinKMohan/TraceBisect"
Issues = "https://github.com/ShebinKMohan/TraceBisect/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tracebisect"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tracebisect"]
