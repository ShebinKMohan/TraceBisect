name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          # Windows is temporarily out of the matrix: 22 tests fail there on
          # POSIX permission assertions (st_mode & 0o777), which Windows does
          # not implement, and on SQLite file-locking during backup and
          # restore. Tracked as a known limitation in the README.
          # - os: windows-latest
          #   python-version: "3.12"

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      # --locked fails the job if uv.lock no longer matches pyproject.toml,
      # so a dependency change that skips `uv lock` cannot pass CI.
      - name: Install package and dev dependencies from uv.lock
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format check
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy src/tracebisect
      - name: Build package
        run: uv run --no-sync python -m build
      - name: Check package metadata
        run: uv run --no-sync twine check dist/*
